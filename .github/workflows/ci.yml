name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and package backend
        run: mvn -B -f backend/pom.xml verify
      - name: Check NVD API key
        id: nvd-key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [[ -n "$NVD_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan backend dependencies
        if: steps.nvd-key.outputs.available == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -f backend/pom.xml org.owasp:dependency-check-maven:12.2.2:check -Dnvd.api.key="$NVD_API_KEY" -DfailBuildOnCVSS=7
      - name: Skip backend dependency scan without NVD API key
        if: steps.nvd-key.outputs.available != 'true'
        run: echo "::warning::Backend dependency scan skipped. Add NVD_API_KEY as a repository Actions secret to enable it."
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Scan frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build Docker images
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_USER: ci-user
          MYSQL_PASSWORD: ci-database-password
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          RABBITMQ_PASSWORD: ci-rabbit-password
          MINIO_ACCESS_KEY: ci-minio-user
          MINIO_SECRET_KEY: ci-minio-password
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: docker compose build
