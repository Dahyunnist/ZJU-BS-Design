spring:
  application:
    name: image-manager
  
  datasource:
    url: jdbc:mysql://localhost:3306/image_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

# JWT配置
jwt:
  secret: image-manager-secret-key-2025-very-long-secret-key-for-jwt-token-generation
  expiration: 86400000 # 24小时

# 文件上传配置
file:
  upload-dir: ./uploads
  thumbnail-dir: ./thumbnails

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# 日志配置
logging:
  level:
    com.zju: DEBUG
    org.springframework.web: INFO

