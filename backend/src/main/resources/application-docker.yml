spring:
  application:
    name: image-manager
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/image_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:imageuser}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  cache:
    type: redis
    redis:
      time-to-live: 60s
      cache-null-values: false
  data:
    redis:
      connect-timeout: 1s
      timeout: 2s
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        concurrency: 1
        max-concurrency: 4
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
        default-requeue-rejected: false
    properties:
      hibernate:

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24小时

# 文件上传配置
file:
  upload-dir: /app/uploads
  thumbnail-dir: /app/thumbnails

storage:
  provider: ${STORAGE_PROVIDER:local}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:images}

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# 日志配置
logging:
  level:
    com.zju: INFO
    org.springframework.web: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  storage:
    orphan-scan-enabled: ${APP_ORPHAN_SCAN_ENABLED:true}
    orphan-min-age: ${ORPHAN_MIN_AGE:24h}
    orphan-scan-initial-delay: 600000
    orphan-scan-delay: 604800000
  queue:
    max-length: ${APP_QUEUE_MAX_LENGTH:10000}
  outbox:
    publisher-enabled: ${APP_OUTBOX_PUBLISHER_ENABLED:true}
    poll-ms: 1000
  worker:
    enabled: ${APP_WORKER_ENABLED:true}
  upload:
    max-per-minute: ${UPLOAD_MAX_PER_MINUTE:20}

