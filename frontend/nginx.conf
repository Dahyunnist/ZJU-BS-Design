limit_req_zone $binary_remote_addr zone=upload_per_ip:10m rate=30r/m;

server {
    listen 3000;
    server_name localhost;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend backend:8080;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 105M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # 转发到后端，保留/api前缀（因为Spring Boot的context-path是/api）
        proxy_pass http://$backend;
        proxy_request_buffering off;
        # 避免大图上传或缩略图生成较慢时触发 504
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location = /api/images/upload {
        limit_req zone=upload_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://$backend;
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

